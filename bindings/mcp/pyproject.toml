[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ptiff-mcp"
version = "1.0.0"
description = "MCP server exposing PTIFF (Planetary TIFF) 1.0 to LLMs."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=2.0",
    "numpy>=2.0",
]

# ``ptiff_pyo3`` (the PyO3 binding over the PTIFF Rust core) is a required
# runtime dependency of this server, but it is NOT installable from PyPI: it is
# built locally via ``maturin`` in crates/ptiff-python and installed into the
# active venv (see README.md). It intentionally stays out of ``dependencies``.

[project.optional-dependencies]
test = ["pytest>=8.0", "anyio[trio]"]

[tool.hatch.build.targets.wheel]
packages = ["src/ptiff_mcp"]
include = ["src/ptiff_mcp/**/*.py"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
addopts = "-ra"
