[package]
name = "ptiff"
version = "0.4.2"
edition = "2021"
description = "Rust bindings to libptiff via the language-agnostic C ABI (libptiff_c)"
license = "Apache-2.0"

[lib]
name = "ptiff"
crate-type = ["lib", "cdylib"]

[dependencies]

[build-dependencies]
# Resolve and link libptiff_c from its installed pkg-config file.
pkg-config = "0.3"
# Generate the raw `extern "C"` FFI declarations from the C ABI headers.
bindgen = "0.72.1"
