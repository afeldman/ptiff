[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ptiff"
version = "0.4.0"
description = "Python bindings for libptiff (Planetary TIFF): raw SWIG output over the C ABI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "PTIFF contributors" },
]
keywords = ["tiff", "planetary", "geospatial", "scientific-imaging", "gis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]
lint = [
    "ruff>=0.4",
]
type = [
    "mypy>=1.8",
]
docs = [
    "sphinx>=7.2",
    "sphinx-rtd-theme>=2.0",
]

# Promoted SWIG output (see bindings/swig/README.md -> "Planned migration"):
# src/ptiff is a package: the SWIG-generated low-level surface (ptiff.py +
# _ptiff.so, no hand-written object model) lives alongside the idiomatic
# Python wrapper layer (camera.py/image.py/tile.py/logger.py/metadata.py +
# __init__.py). ptiff.py and _ptiff.so are generated by `make -C ../swig
# python`, relocated into the package dir, and gitignored; never hand-edited
# or committed. ptiff_wrap.c is a build intermediate, not shipped.
[tool.hatch.build.targets.wheel]
include = ["src/ptiff"]
exclude = [
    "src/ptiff/ptiff_wrap.c",
    "src/ptiff/__pycache__",
]

[tool.hatch.build.targets.wheel.sources]
src = ""

[tool.hatch.build.targets.sdist]
include = [
    "src",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "test"]
# ptiff.py is SWIG-generated (never hand-edited, regenerated by `make -C
# ../swig python`) and is not ruff-clean as SWIG emits it.
extend-exclude = ["src/ptiff/ptiff.py"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
    "S",
]
ignore = [
    "S101",  # assert in tests is fine
    "B008",
]
per-file-ignores = {}

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
mypy_path = ["src"]
files = ["test"]
strict = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
# ptiff.py (SWIG-generated) is followed via the test files' `import ptiff`
# even though it's outside `files` above. Its generated import-fallback
# pattern ("try: from . import _ptiff except ImportError: import _ptiff")
# reads as an unresolvable relative import to mypy run outside a real
# package, which is a hard import-following failure ignore_errors can't
# suppress -- follow_imports=skip stops mypy from parsing the module at all
# and treats it as untyped (Any), same effect as the old ptiff._ptiff
# override achieved for the ctypes layer.
module = "ptiff"
follow_imports = "skip"

# ptiff.py (SWIG-generated, promoted from bindings/swig -- see
# bindings/swig/README.md) is dynamically-typed SWIG plumbing with no type
# stubs; excluded from `files` above rather than fought with overrides.
