name: Ruby bindings

# Builds the standalone C ABI library (libptiff_c), regenerates the SWIG Ruby
# extension (bindings/ruby/lib/ptiff.bundle -- promoted output, see the
# "alles in SWIG" migration notes in bindings/swig/README.md), then tests
# bindings/ruby against it via the gem's own Rakefile. Uses the same
# OS/compiler matrix as the C++, Go and Python binding jobs.

on:
  push:
  pull_request:

jobs:
  ruby-bindings:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: pip install conan

      - name: Configure Conan profile
        run: conan profile detect --force

      - name: Install dependencies (Conan)
        run: conan install . --output-folder=build --build=missing -s build_type=Debug

      - name: Install SWIG (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y swig

      - name: Install SWIG (macOS)
        if: runner.os == 'macOS'
        run: brew install swig

      - name: Configure (C++ + C ABI)
        shell: bash
        run: >
          cmake -B build -S .
          -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake
          -DCMAKE_BUILD_TYPE=Debug
          -DPTIFF_BUILD_C_BINDINGS=ON
          -DPTIFF_BUILD_TESTS=OFF
          -DBUILD_SHARED_LIBS=ON

      - name: Build libptiff_c
        run: cmake --build build --target ptiff_c

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: bindings/ruby

      # Regenerates bindings/ruby/lib/{ptiff.bundle,ptiff_wrap.c} against the
      # libptiff_c just built. Must run after Ruby is set up: the compiled
      # extension's ABI is tied to the exact interpreter headers used to
      # build it (RbConfig::CONFIG["rubyhdrdir"]), matching the same
      # build-order constraint as the Python extension.
      - name: Regenerate SWIG Ruby module
        env:
          PTIFF_C_LIB_DIR: ${{ github.workspace }}/build/bindings/c
        run: make -C bindings/swig ruby

      - name: Test (rake)
        working-directory: bindings/ruby
        run: bundle exec rake test
