name: Benchmarks

# Runs the cross-language benchmark suite (benchmarks/run_benchmarks.sh) as a
# regression check: it builds libptiff_c (Rust, crates/ptiff-c) + all language
# bindings, then measures read/write throughput across Python/Ruby/Go/Octave/Rust
# and the ptiff CLI. Median times are saved as a workflow artifact so you can
# diff cycles or releases.
#
# Deliberately runs ONLY on version tags (v*) and via manual workflow_dispatch
# (not on every push/PR): this suite builds every binding, so running it on each
# push/PR would burn CI time and create noisy artifacts for intermediate work.
# Run it on demand (dispatch) or let it produce the official number for a
# release tag.
#
# Numbers on CI are intentionally coarse (reduced BENCH_REPEATS/BENCH_ITERS +
# Release build) -- the point is a *stable ordering + trend*, not precise
# wall-clock figures (those need a quiet dedicated host, as documented in
# benchmarks/README.md).
#
# Runs on ubuntu-latest only: the Octave (mkoctfile) MEX binding and the SWIG
# matrix are cheapest and most reliable there; the suite itself is OS-agnostic
# and can be re-run locally on macOS/Windows.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  benchmarks:
    # Pin to ubuntu-24.04 and install SWIG 4.5.0 via pip (see the Install
    # SWIG step below): this repo is developed/validated against SWIG 4.5.x
    # and its generated code differs materially from the apt `swig` (4.2.0) --
    # e.g. Go enum type names and the 3-arg SWIG_*_AppendOutput arity (see
    # bindings/swig/typemaps.i). Using 4.5.0 here keeps codegen identical to
    # local dev and the macos-latest binding jobs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # maturin builds the PyO3 Python binding (crates/ptiff-python) into the
      # runner's Python env so `import ptiff` works for the python benchmark.
      - name: Install maturin (PyO3 build tool)
        run: pip install maturin

      # SWIG 4.5.0 via a pip binary wheel (the `swig` PyPI package), NOT the
      # distro apt `swig` (Ubuntu 24.04 is only 4.2.0). This repo is developed
      # and validated against SWIG 4.5.x (Homebrew locally, brew on
      # macos-latest); generated code differs materially between 4.2 and 4.5
      # (Go enum type names, the 3-arg SWIG_*_AppendOutput arity), so CI must
      # use the same 4.5.0 as local/macOS. setup-python puts the pip bin dir on
      # PATH, so `swig` resolves without further steps.
      - name: Install SWIG 4.5.0 (Linux)
        run: pip install swig==4.5.0

      - name: Install build toolchain + languages (Linux)
        run: |
          sudo apt-get update
          # octave-dev provides mkoctfile (needed by bindings/octave/mex/Makefile)
          sudo apt-get install -y swig golang-go ruby octave octave-dev pkg-config
          # Rust via rustup in a later step (dtolnay/rust-toolchain).

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Release libptiff_c: the benchmark measures binding overhead over a
      # properly optimized libptiff_c, not debug symbols. Built by the Rust
      # crate crates/ptiff-c into target/release/.
      - name: Build libptiff_c (Rust)
        run: cargo build -p ptiff-c --release

      # Build the PyO3 Python binding into the active Python env so the python
      # benchmark can `import ptiff` (the legacy SWIG bindings/python was
      # removed in favour of crates/ptiff-python + maturin). Use `maturin build`
      # + pip install (not `maturin develop`, which demands a virtualenv).
      - name: Build Python binding (PyO3, maturin)
        working-directory: crates/ptiff-python
        run: |
          maturin build --release --out dist/
          pip install --quiet dist/*.whl

      # --- Build every language binding against the freshly built C ABI ---
      # (bindings/swig/Makefile links the Rust-built libptiff_c by default)
      - name: Build SWIG Ruby binding
        run: make -C bindings/swig ruby

      - name: Build SWIG Go binding
        run: make -C bindings/swig go

      - name: Build Octave MEX binding
        run: make -C bindings/octave/mex build

      - name: Build Rust binding + CLI
        run: cargo build -p ptiff-cli --release

      # Run the suite (Python/Ruby/Go/Octave/Rust/CLI). Reduced knobs keep CI
      # fast while still exercising every binding and the summary pipeline.
      # run_benchmarks.sh resolves libptiff_c from target/release; no prefix.
      - name: Run benchmark suite
        working-directory: benchmarks
        env:
          BENCH_REPEATS: "5"
          BENCH_ITERS: "10"
        run: ./run_benchmarks.sh python ruby go octave rust cli

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/benchmark-results/
          if-no-files-found: error
