name: Benchmarks

# Runs the cross-language benchmark suite (benchmarks/run_benchmarks.sh) on
# every push/PR as a regression check: it builds libptiff_c + all language
# bindings, then measures read/write throughput across Python/Ruby/Go/Octave/
# Rust and the ptiff CLI. Median times are saved as a workflow artifact so you
# can diff cycles or PRs.
#
# Numbers on CI are intentionally coarse (reduced BENCH_REPEATS/BENCH_ITERS +
# Release build) -- the point is a *stable ordering + trend*, not precise
# wall-clock figures (those need a quiet dedicated host, as documented in
# benchmarks/README.md).
#
# Runs on ubuntu-latest only: Octave (mkoctfile) and the SWIG matrix are
# cheapest and most reliable there; the suite itself is OS-agnostic and can be
# re-run locally on macOS/Windows.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: pip install conan

      - name: Configure Conan profile
        run: conan profile detect --force

      - name: Install dependencies (Conan, Release)
        run: conan install . --output-folder=build --build=missing -s build_type=Release

      - name: Install build toolchain + languages (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y swig golang-go ruby octave mkoctfile pkg-config
          # Rust via rustup in a later step (dtolnay/rust-toolchain).

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Release + shared libs + C ABI: the benchmark measures binding overhead
      # over a properly optimized libptiff_c, not debug symbols.
      - name: Configure (Release, shared lib, C bindings)
        run: >
          cmake -B build -S .
          -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=ON
          -DPTIFF_BUILD_C_BINDINGS=ON
          -DPTIFF_BUILD_TESTS=OFF

      - name: Build libptiff_c
        run: cmake --build build --target ptiff_c --config Release --parallel 2

      # Install the shared libraries to a prefix so Go/Rust (and the CLI) can
      # resolve libptiff_c via pkg-config, exactly like run_benchmarks.sh does
      # with its `install-shared` default.
      - name: Install libptiff_c + libptiff to a prefix
        run: cmake --install build --prefix ${{ github.workspace }}/ptiff-install --config Release

      # --- Build every language binding against the freshly built C ABI ---
      - name: Build SWIG Python binding
        env:
          PTIFF_C_LIB_DIR: ${{ github.workspace }}/build/bindings/c
        run: make -C bindings/swig python

      - name: Build SWIG Ruby binding
        env:
          PTIFF_C_LIB_DIR: ${{ github.workspace }}/build/bindings/c
        run: make -C bindings/swig ruby

      - name: Build SWIG Go binding
        env:
          PTIFF_C_LIB_DIR: ${{ github.workspace }}/build/bindings/c
        run: make -C bindings/swig go

      - name: Build SWIG Octave binding
        env:
          PTIFF_C_LIB_DIR: ${{ github.workspace }}/build/bindings/c
        run: make -C bindings/swig octave

      - name: Build Rust binding + CLI
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/ptiff-install/lib/pkgconfig
        run: cargo build --manifest-path ptiff-cli/Cargo.toml --release

      # Run the suite (Python/Ruby/Go/Octave/Rust/CLI). Reduced knobs keep CI
      # fast while still exercising every binding and the summary pipeline.
      - name: Run benchmark suite
        working-directory: benchmarks
        env:
          PTIFF_PREFIX: ${{ github.workspace }}/ptiff-install
          BENCH_REPEATS: "5"
          BENCH_ITERS: "10"
        run: ./run_benchmarks.sh python ruby go octave rust cli

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/benchmark-results/
          if-no-files-found: error
