name: Release

# Builds tagged releases of the PTIFF Rust library as native OS packages and
# publishes them as a GitHub Release, and re-triggers the Pages + docs build
# for the tag.
#
#   Linux (ubuntu-latest):  Rust + Ninja -> CPack DEB + RPM
#   macOS (macos-latest):   Rust + Ninja -> CPack productbuild .pkg
#
# Each package carries the Rust `ptiff` CLI (crates/ptiff-cli, a pure-Rust
# workspace binary over ptiff-core) and the C ABI `libptiff_c` (crates/ptiff-c:
# shared + static lib, cbindgen header, pkg-config). There is no C++ library:
# `cargo` is the build, CMake only wraps the install + CPack packaging.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package:
    name: Package (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            packages: deb+rpm
          - os: macos-latest
            label: macOS
            packages: pkg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system tools + packagers
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            # ninja+cmake (CMake generator), rpm/dpkg+patchelf (CPack DEB/RPM
            # packaging) and the C ABI build tools for the pkg-config installer.
            sudo apt-get install -y ninja-build cmake rpm dpkg patchelf
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install ninja cmake || brew link ninja cmake
          fi

      # Build the C ABI first (the CMake install references the lib + header
      # that `cargo build -p ptiff-c --release` produces). The CLI is built
      # next via the `ptiff_cli` CMake target after configure.
      - name: Build C ABI (libptiff_c, Rust)
        run: cargo build -p ptiff-c --release

      - name: Configure (CMake packaging wrapper, Release)
        run: >
          cmake -G Ninja -B build-rel/build -S .
          -DCMAKE_BUILD_TYPE=Release
          -DPTIFF_BUILD_C_ABI=ON
          -DPTIFF_BUILD_CLI=ON
          -DPTIFF_BUILD_DOCS=OFF

      - name: Build ptiff CLI (Rust, workspace crate)
        run: cmake --build build-rel/build --target ptiff_cli --config Release

      - name: Install to staging prefix (CLI + C ABI + header + pkg-config)
        run: cmake --install build-rel/build --config Release --prefix "${{ github.workspace }}/staging"

      - name: Smoke test the packaged CLI
        shell: bash
        run: |
          "${{ github.workspace }}/staging/bin/ptiff" version
          "${{ github.workspace }}/staging/bin/ptiff" --help >/dev/null

      - name: Build native packages (CPack deb + rpm on Linux, .pkg on macOS)
        working-directory: build-rel/build
        run: cpack -C Release

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/dist"
          cp build-rel/build/*.deb build-rel/build/*.rpm build-rel/build/*.pkg "${{ github.workspace }}/dist/" 2>/dev/null || true
          cd "${{ github.workspace }}/dist"
          ls -la
          shasum -a 256 * > SHA256SUMS

      - name: Upload packages (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ptiff-${{ matrix.label }}
          path: ${{ github.workspace }}/dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ github.workspace }}/dist/*
          fail_on_unmatched_files: false
