name: Release

# Builds tagged releases of the PTIFF Rust library as native OS packages and
# publishes them as a GitHub Release, and re-triggers the Pages + docs build
# for the tag.
#
# The matrix covers all three major desktop/server OSes on *both* common CPU
# architectures, so the release ships native packages for Intel/AMD (x86_64)
# AND the "small CPU"/ARM world (arm64: Apple Silicon, Windows on ARM, AWS
# Graviton / Raspberry Pi 4+):
#
#   Linux   ubuntu-latest       x86_64 native  -> CPack DEB + RPM
#   Linux   ubuntu-24.04-arm    arm64  native  -> CPack DEB + RPM
#   macOS   macos-13            x86_64 native  -> CPack productbuild .pkg
#   macOS   macos-14            arm64  native  -> CPack productbuild .pkg
#   Windows windows-2022        x86_64 native  -> CPack ZIP + NSIS .exe
#   Windows windows-11-arm      arm64  native  -> CPack ZIP + NSIS .exe
#
# Every job runs on hardware matching its target arch, so no cross-compilation
# is needed: cargo builds for the native host and the CMake wrapper derives the
# arch from CMAKE_SYSTEM_PROCESSOR for the <OS>-<arch>-qualified package name.
#
# Each package carries the Rust `ptiff` CLI (crates/ptiff-cli, a pure-Rust
# workspace binary over ptiff-core) and the C ABI `libptiff_c` (crates/ptiff-c:
# shared + static lib, cbindgen header, pkg-config on *nix / import lib on
# Windows). There is no C++ library: `cargo` is the build, CMake only wraps the
# install + CPack packaging.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package:
    name: Package (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            arch: x86_64
            packages: deb+rpm
          - os: ubuntu-24.04-arm
            label: linux-arm64
            arch: arm64
            packages: deb+rpm
          - os: macos-15
            label: macos-arm64
            arch: arm64
            packages: pkg
          - os: windows-2022
            label: windows-x86_64
            arch: x86_64
            packages: zip
          - os: windows-11-arm
            label: windows-arm64
            arch: arm64
            packages: zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system tools + packagers
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            # ninja+cmake (CMake generator), rpm/dpkg+patchelf (CPack DEB/RPM
            # packaging) and the C ABI build tools for the pkg-config installer.
            sudo apt-get install -y ninja-build cmake rpm dpkg patchelf
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install ninja cmake || brew link ninja cmake
          else
            # Windows runners already ship cmake + ninja and CPack's ZIP
            # generator. Install NSIS (makensis) so the .exe installer is
            # produced as well; CMake picks it up via find_program(makensis).
            choco install nsis --yes --no-progress
            echo "NSIS at: $(command -v makensis)"
          fi

      # Build the C ABI first (the CMake install references the lib + header
      # that `cargo build -p ptiff-c --release` produces). The CLI is built
      # next via the `ptiff_cli` CMake target after configure.
      - name: Build C ABI (libptiff_c, Rust)
        shell: bash
        run: cargo build -p ptiff-c --release

      - name: Configure (CMake packaging wrapper, Release)
        shell: bash
        run: >
          cmake -G Ninja -B build-rel/build -S .
          -DCMAKE_BUILD_TYPE=Release
          -DPTIFF_BUILD_C_ABI=ON
          -DPTIFF_BUILD_CLI=ON
          -DPTIFF_BUILD_DOCS=OFF

      - name: Build ptiff CLI (Rust, workspace crate)
        shell: bash
        run: cmake --build build-rel/build --target ptiff_cli --config Release

      - name: Install to staging prefix (CLI + C ABI + header + pkg-config)
        shell: bash
        run: cmake --install build-rel/build --config Release --prefix "${{ github.workspace }}/staging"

      - name: Smoke test the packaged CLI
        shell: bash
        run: |
          CLI="${{ github.workspace }}/staging/bin/ptiff"
          # .exe is not auto-discovered in bash on Windows; point at the full name.
          if [[ "$RUNNER_OS" == "Windows" ]]; then CLI="$CLI.exe"; fi
          "$CLI" version
          "$CLI" --help >/dev/null

      - name: Build native packages (CPack deb/rpm / pkg / zip / nsis)
        working-directory: build-rel/build
        shell: bash
        run: cpack -C Release

      - name: Collect artifacts (arch-qualified)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/dist"
          # CPack names packages ptiff-<version>-<OS>-<arch>.<ext>; copy every
          # platform package matching this arch's build (incl. the NSIS .exe).
          find build-rel/build -maxdepth 1 -type f \
            \( -name "*.deb" -o -name "*.rpm" -o -name "*.pkg" \
            -o -name "*.zip" -o -name "*.exe" \) \
            -exec cp {} "${{ github.workspace }}/dist/" \;
          cd "${{ github.workspace }}/dist"
          ls -la
          # SHA256 manifest, portable across runners: `shasum` (macOS/Linux),
          # GNU `sha256sum` (Linux, and Git for Windows when installed), and a
          # last-resort no-op so non-*nix hosts still build the release.
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 ./* > SHA256SUMS
          elif command -v sha256sum >/dev/null 2>&1; then
            sha256sum ./* > SHA256SUMS
          else
            echo "# SHA256SUMS not generated: no shasum/sha256sum on this runner" > SHA256SUMS
          fi

      - name: Upload packages (artifact)
        uses: actions/upload-artifact@v7
        with:
          name: ptiff-${{ matrix.label }}
          path: ${{ github.workspace }}/dist/
          if-no-files-found: error

  # Single, aggregation job that publishes the GitHub Release. Publishing from
  # inside the 5-way packaging matrix races: each cell writes the same release
  # object at once, and softprops/action-gh-release intermittently fails with
  # "Not Found ... delete a release asset" when cells collide on asset list
  # bookkeeping. One job, after all packages are uploaded, is deterministic.
  release-publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    if: always() && needs.package.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          pattern: ptiff-*
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**
          fail_on_unmatched_files: false
