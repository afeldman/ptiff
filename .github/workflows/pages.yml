name: Pages

# Builds the Doxygen documentation and uploads it as a Pages artifact.
#
# This job is invoked as a *reusable workflow* (workflow_call) from the central
# `ci.yml` orchestrator, which runs it as the final "docs" phase -- only when a
# version tag (v*) is present. The actual `actions/deploy-pages` step lives in
# the *caller* (ci.yml), because GitHub Pages deployments are not permitted
# inside reusable workflows (deploy requires the `pages:` environment +
# `id-token` on the calling workflow side; it cannot be delegated down).
#
# The single source of truth for the docs is the hand-written `Doxyfile` in the
# repo root (`doxygen Doxyfile` writes HTML into build/docs/html), matching the
# `docs` CMake target. A dedicated formatter is not required by the page build.
#
# Doxygen INPUT includes the cbindgen-generated C ABI header
# (`target/ptiff_c.h`); the header only exists after `cargo build -p ptiff-c`
# runs its build.rs, so this job builds it before running Doxygen.

on:
  workflow_call:

# `DEPLOY_PATH` points at the directory Doxygen writes its HTML into.
# (The Doxyfile PROJECT_NUMBER reflects the project version.)
env:
  DEPLOY_PATH: build/docs/html

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate C ABI header (target/ptiff_c.h)
        run: cargo build -p ptiff-c

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Check Doxygen version
        run: doxygen --version

      - name: Build documentation
        run: |
          mkdir -p build/docs
          doxygen Doxyfile

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.DEPLOY_PATH }}
