name: Go bindings

# Builds and tests the SWIG-generated Go bindings (bindings/go/ptiff), promoted
# from bindings/swig (see the "alles in SWIG" migration notes in
# bindings/swig/README.md). `make -C bindings/swig go` regenerates
# ptiff/{ptiff.go,ptiff_wrap.c,cgo_flags.go} (requires SWIG on PATH), then
# `go test` runs the suite.

on:
  workflow_call:

jobs:
  go-build:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 (not ubuntu-latest) is pinned; the SWIG step installs
        # 4.5.0 via pip (matching local/macOS). See the Install SWIG step.
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install SWIG (Linux)
        if: runner.os == 'Linux'
        # Pin to SWIG 4.5.0 via a pip binary wheel (the `swig` PyPI package),
        # NOT the distro apt `swig` (Ubuntu 24.04 is only 4.2.0). This repo is
        # developed and validated against SWIG 4.5.x (Homebrew locally, brew on
        # macos-latest); generated code differs materially between 4.2 and 4.5
        # (Go enum type names, the 3-arg SWIG_*_AppendOutput arity), so CI must
        # use the same 4.5.0 as local/macOS to keep codegen identical.
        run: pip install swig==4.5.0

      - name: Install SWIG (macOS)
        if: runner.os == 'macOS'
        run: brew install swig

      # The Go binding builds on the standalone C ABI (libptiff_c), built by
      # the Rust crate crates/ptiff-c via Cargo into target/release/.
      - name: Build libptiff_c (Rust)
        run: cargo build -p ptiff-c --release

      # Regenerates bindings/go/ptiff/{ptiff.go,ptiff_wrap.c,cgo_flags.go} from
      # bindings/swig/ptiff.i (the Makefile links the Rust-built libptiff_c by
      # default), then `go test`.
      - name: Generate SWIG Go bindings
        run: make -C bindings/swig go

      - name: Test (go test)
        working-directory: bindings/go
        run: go test ./ptiff

      # -unsafeptr=false: SWIG's generated ptiff.go trips vet's unsafe.Pointer
      # heuristic on its own boilerplate (a well-known SWIG/Go false positive,
      # not a real issue in generated code we don't hand-edit). All other vet
      # checks still run, including over the hand-written *_test.go files.
      - name: go vet
        working-directory: bindings/go
        run: go vet -unsafeptr=false ./ptiff/

  go-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      # ptiff/ptiff.go is SWIG-generated (never hand-edited, regenerated by the
      # go-build job) and is not gofmt-clean as SWIG emits it -- excluded here.
      # Only the hand-written *_test.go files are format-checked.
      - name: gofmt
        working-directory: bindings/go
        run: |
          files=$(find ptiff -name '*_test.go')
          test -z "$(gofmt -l $files)" || { echo "gofmt needed on:"; gofmt -l $files; exit 1; }
