name: Go bindings

# Builds and tests the SWIG-generated Go bindings (bindings/go/ptiff), promoted
# from bindings/swig (see the "alles in SWIG" migration notes in
# bindings/swig/README.md). CTest regenerates ptiff/{ptiff.go,ptiff_wrap.c,
# cgo_flags.go} via `make -C bindings/swig go` (requires SWIG on PATH), then
# runs `go test`.

on:
  push:
  pull_request:

jobs:
  go-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: pip install conan

      - name: Configure Conan profile
        run: conan profile detect --force

      - name: Install dependencies (Conan)
        run: conan install . --output-folder=build --build=missing -s build_type=Debug

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install SWIG (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y swig

      - name: Install SWIG (macOS)
        if: runner.os == 'macOS'
        run: brew install swig

      # The Go binding builds on the standalone C ABI (libptiff_c), which
      # PTIFF_BUILD_GO_BINDINGS pulls in automatically.
      - name: Configure (shared lib + C + Go bindings)
        run: >
          cmake -B build -S .
          -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_SHARED_LIBS=ON
          -DPTIFF_BUILD_C_BINDINGS=ON
          -DPTIFF_BUILD_GO_BINDINGS=ON

      # Build libptiff_c (draws in libptiff transitively for a shared build).
      - name: Build libptiff_c
        run: cmake --build build --target ptiff_c --config Debug

      # Regenerates bindings/go/ptiff/{ptiff.go,ptiff_wrap.c,cgo_flags.go} from
      # bindings/swig/ptiff.i (ptiff_go_bindings_generate), then `go test`
      # (ptiff_go_bindings).
      - name: Test (ctest -> swig regen -> go test)
        working-directory: build
        run: ctest --output-on-failure --build-config Debug -R ptiff_go_bindings

      # -unsafeptr=false: SWIG's generated ptiff.go trips vet's unsafe.Pointer
      # heuristic on its own boilerplate (a well-known SWIG/Go false positive,
      # not a real issue in generated code we don't hand-edit). All other vet
      # checks still run, including over the hand-written *_test.go files.
      - name: go vet
        working-directory: bindings/go
        run: go vet -unsafeptr=false ./ptiff/

  go-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      # ptiff/ptiff.go is SWIG-generated (never hand-edited, regenerated by the
      # go-build job) and is not gofmt-clean as SWIG emits it -- excluded here.
      # Only the hand-written *_test.go files are format-checked.
      - name: gofmt
        working-directory: bindings/go
        run: |
          files=$(find ptiff -name '*_test.go')
          test -z "$(gofmt -l $files)" || { echo "gofmt needed on:"; gofmt -l $files; exit 1; }
