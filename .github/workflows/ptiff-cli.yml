name: ptiff-cli

# Builds and tests the Rust command-line tool (crates/ptiff-cli). The CLI is a
# pure-Rust binary over ptiff-rust -> ptiff-core (no C ABI, no C++); `cargo`
# builds and tests it directly.

on:
  workflow_call:

jobs:
  cli-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        working-directory: crates/ptiff-cli
        run: cargo fmt --check

      - name: Clippy
        working-directory: crates/ptiff-cli
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: crates/ptiff-cli
        run: cargo test

      - name: Smoke test
        working-directory: crates/ptiff-cli
        run: |
          cargo run -q -- version
          cargo run -q -- --help >/dev/null
