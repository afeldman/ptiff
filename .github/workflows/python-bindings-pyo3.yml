name: Python bindings (ptiff-python / PyO3)

# Builds and tests the current Python binding (crates/ptiff-python, Plan §9
# Option B): a maturin-driven PyO3 extension module over the Rust core (ptiff →
# ptiff-core), with a NumPy-integrated tile API. The legacy SWIG Python module
# (bindings/python) has been removed, so this is the only Python binding.

on:
  workflow_call:

jobs:
  python-bindings-pyo3:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build/test tools (maturin, pytest, numpy)
        run: |
          pip install --quiet maturin pytest numpy

      # ptiff-python is excluded from the root workspace (see crates/
      # ptiff-python/Cargo.toml), so its Rust unit tests run in its own
      # directory against its own lockfile. Requires a Python install to link
      # libpython (available via setup-python above).
      - name: Rust unit tests (cargo)
        working-directory: crates/ptiff-python
        run: cargo test -p ptiff-python

      - name: Build extension module (maturin build + pip install)
        working-directory: crates/ptiff-python
        run: |
          # maturin develop requires an activated virtualenv; on CI with
          # actions/setup-python there is none, so build a wheel and install it
          # (no venv/conda needed) -- the PyO3 module then lands on the active
          # interpreter's site-packages for the pytest step below.
          maturin build --release --out dist/
          pip install --quiet dist/*.whl

      - name: Test (pytest)
        working-directory: crates/ptiff-python
        run: python -m pytest python/tests -v
