name: Build

# PTIFF is a Rust project; every test and lint target is exercised through
# Cargo. This is the main CI: build + full-test the workspace (all features)
# across OSes, run fmt/clippy, then build the C ABI (libptiff_c) and run the
# C ABI capability test against the generated C header.

on:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (all targets, all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build (workspace, all features)
        run: cargo build --workspace --all-features

      - name: Test (workspace, all features)
        run: cargo test --workspace --all-features

      # The C ABI is part of the shipped surface (SWIG bindings + C consumers);
      # verify the cbindgen header compiles and the library links + runs in C.
      - name: Build C ABI (libptiff_c)
        run: cargo build -p ptiff-c --release

      # The C ABI test links the MSVC-compiled Rust staticlib against a C
      # object produced by MinGW gcc (`cc`).  The two toolchains share no
      # common runtime, so the link fails with undefined `__chkstk` and
      # `??_7type_info@@6B@`.  Skip the test on Windows until the Makefile
      # is updated to drive `cl.exe` instead.
      - name: C ABI capability test (C)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: crates/ptiff-c/tests/c
        run: make run

  # ARM64 ("small CPU") coverage. The x86 matrix above runs on the three
  # primary runners; this job re-runs the full build+test+C-ABI chain on a
  # native arm64 runner (GitHub's Ubuntu ARM public preview, e.g. AWS Graviton /
  # Raspberry Pi 4+ class hardware) so the "small CPU" world is continuously
  # verified, not just at release time.
  arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (arm64)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (all targets, all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build (workspace, all features)
        run: cargo build --workspace --all-features

      - name: Test (workspace, all features)
        run: cargo test --workspace --all-features

      - name: Build C ABI (libptiff_c, arm64)
        run: cargo build -p ptiff-c --release

      - name: C ABI capability test (C)
        shell: bash
        working-directory: crates/ptiff-c/tests/c
        run: make run

  # Rust toolchain cross-check on the minimum rust-version declared for the
  # workspace (kept cheap: build-only on Linux).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
      - name: Build (MSRV, -Z minimal-versions not needed for a dep-light core)
        run: cargo build --workspace --all-features
