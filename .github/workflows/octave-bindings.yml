name: Octave bindings

# Builds the standalone C ABI library (libptiff_c) via the Rust crate
# crates/ptiff-c, then builds the hand-written Octave MEX binding
# (bindings/octave/mex/) with `make build` and runs the MEX test suite with
# `make test`. This is the *only* Octave binding; the old SWIG-Octave path
# (bindings/octave/lib + bindings/octave/test) has been removed in favour of
# the C++ MEX adapter (see PTIFF-1.0-RUST-CORE-PLAN.md §10).

on:
  workflow_call:

jobs:
  octave-bindings:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Octave (Linux)
        if: runner.os == 'Linux'
        # mkoctfile does NOT ship inside the `octave` package on
        # Debian/Ubuntu -- it needs the separate `octave-dev` package.
        run: sudo apt-get update && sudo apt-get install -y octave octave-dev

      - name: Install Octave (macOS)
        if: runner.os == 'macOS'
        run: brew install octave

      # libptiff_c is built by the Rust crate crates/ptiff-c into
      # target/release/ (bindings/octave/mex/Makefile links there by default).
      - name: Build libptiff_c (Rust)
        run: cargo build -p ptiff-c --release

      # Builds bindings/octave/mex/ptiff_octave.oct (mkoctfile) against the
      # libptiff_c just built, with an rpath so no DYLD/LD_LIBRARY_PATH is
      # needed at runtime.
      - name: Build Octave MEX binding
        run: make -C bindings/octave/mex build

      - name: Test (MEX suite)
        run: make -C bindings/octave/mex test
