name: Julia bindings

# Builds the standalone C ABI library (libptiff_c) via the Rust crate
# crates/ptiff-c, then runs the hand-written Julia binding test suite
# (bindings/julia/test/runtests.jl) with `make test`. Julia needs no adapter
# compile step: Ptiff.jl calls libptiff_c directly through `ccall`.

on:
  workflow_call:

jobs:
  julia-bindings:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu runners are x86_64: exercise the declared minimum Julia
          # version (1.6) against the real x86_64 binaries.
          - os: ubuntu-24.04
            julia-version: '1.6'
          # `macos-latest` resolves to Apple Silicon (aarch64); Julia 1.6/1.7
          # have no native ARM darwin binaries, so use the current LTS there.
          # This also validates the binding against a modern Julia.
          - os: macos-latest
            julia-version: 'lts'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}

      # libptiff_c is built by the Rust crate crates/ptiff-c into
      # target/release/ (Ptiff.libpath() resolves there by default).
      - name: Build libptiff_c (Rust)
        run: cargo build -p ptiff-c --release

      - name: Test (Julia suite)
        run: make -C bindings/julia test
