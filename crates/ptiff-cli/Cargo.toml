[package]
name = "ptiff-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true
description = "Command-line interface for the PTIFF planetary image standard"


[[bin]]
name = "ptiff"
path = "src/main.rs"

[dependencies]
# The idiomatic Rust binding, reused rather than re-implementing FFI.
ptiff = { path = "../ptiff-rust" }
clap = { version = "4.6.6", features = ["derive"] }
serde_json = "1"

[build-dependencies]
