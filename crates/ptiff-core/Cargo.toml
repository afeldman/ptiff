# ptiff-core: the PTIFF 1.0 Rust core
#
# This crate holds the fundamental, stable domain types of PTIFF. It is the
# single maintained core implementation (Architectural Response §3.1.1).
#
# Design constraints (PTIFF-1.0-RUST-CORE-PLAN.md §4.2/§4.3):
#   - NO C ABI here (#[no_mangle]); that lives in the separate `ptiff-c` crate.
#   - NO PyO3 / MEX / SWIG here.
#   - NO HTTP transport implementation here (only a trait in a later phase).
#   - Dependencies are deliberately minimal and stable.
[package]
name = "ptiff-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true
description = "PTIFF 1.0 Rust core: domain types and formats (TIFF/BigTIFF)."

[features]
# Optional serde (de)serialization of the domain model for diagnostics/audit
# (§4.4 in PTIFF-1.0-RUST-CORE-PLAN.md). Off by default: keeps the core
# dependency-light. When enabled, adds `derive(Serialize, Deserialize)` to the
# public model types (PixelType, CompressionKind, ImageDescriptor, Scene, ...).
serde = ["dep:serde"]
# Dependency-free per-image pixel tier (MemoryImageInfo/MemoryImageSource/
# MemoryImageSink) shared by MemoryBackend and any other backend that stores
# a plain, uncompressed, tile-addressable pixel block (e.g. isis-backend).
# Implied by `memory-backend`; enable directly to get the pixel tier without
# pulling in serde_json.
memory-pixel-tier = []
# Optional in-memory ("PMEM") StorageBackend that encodes the format-neutral
# StorageModel as JSON via serde_json. Also enables `serde` for the model
# derives. Off by default.
memory-backend = ["dep:serde_json", "serde", "memory-pixel-tier"]
# Optional TIFF/BigTIFF StorageBackend that parses/encodes the on-disk TIFF
# format (header, IFD, tags) over a BinaryReader/BinaryWriter transport, plus
# the writer policies and image source/sink. Off by default. The format layer
# is dependency-free (works on the raw byte transport); only the writer policy
# layer pulls in optional deps.
tiff-backend = []
# Optional USGS ISIS3-style StorageBackend: a PDS3-style text label (Object=
# IsisCube/Core, Group=Dimensions/Pixels) followed by a seekable, uncompressed
# pixel block, reusing the memory-pixel-tier for pixel I/O. Dependency-free.
isis-backend = ["memory-pixel-tier"]
# Optional NASA PDS4-style StorageBackend: a `Product_Observational` XML label
# (holding one `Array_2D_Image` per image) followed by a seekable,
# uncompressed pixel block, reusing the memory-pixel-tier for pixel I/O. Pulls
# in `quick-xml` for XML (de)serialization (PTIFF-1.0-RUST-CORE-PLAN.md §5).
pds4-backend = ["dep:quick-xml", "memory-pixel-tier"]
# Optional Zarr-style chunked array StorageBackend: an 8-byte seek header, a
# JSON array header (shape/chunks/dtype/compressor via `serde_json`), then
# fixed-size chunk slots holding zstd/zlib-compressed (or raw) chunks (chunk
# == tile for this phase). Pulls in `serde_json` for the JSON header, `zstd`
# for zstd chunk compression, and the already-optional `flate2` for zlib
# chunk compression (PTIFF-1.0-RUST-CORE-PLAN.md §5).
zarr-backend = ["dep:serde_json", "dep:zstd", "dep:flate2"]
# Optional OpenEXR-style storage backend: a real, standalone .exr file (single
# whole-image tile this phase) read/written through the pure-Rust `exr` crate
# (no unsafe code). Only Float32 and UInt32 pixel types (matching native OpenEXR
# FLOAT/UINT channels), samplesPerPixel 1 (Y)/3 (RGB)/4 (RGBA), uncompressed.
# Off by default so the core stays dependency-light; pulls in `exr`.
openexr-backend = ["dep:exr"]
# Optional TIFF compression codecs that pull in third-party (pure-Rust)
# libraries: Deflate (zlib, RFC 1950) via `flate2`/miniz_oxide and JPEG
# (baseline, 4:4:4) via `jpeg-encoder`/`jpeg-decoder`. Off by default so the
# `tiff-backend` feature alone keeps the build dependency-free. Implies
# `tiff-backend` (the codecs are only used by the TIFF source/sink).
tiff-codecs = ["dep:flate2", "dep:jpeg-encoder", "dep:jpeg-decoder", "tiff-backend"]
# Optional HTTP(S) Range-request byte transport, mirroring the C++
# `ptiff::io::HttpRangeBinaryReader`: a seekable `BinaryReader` over a remote
# object (S3/GCS/Azure presigned URL or any endpoint honouring `Range`) with a
# read-ahead buffer. Any backend that only knows `BinaryReader` (e.g. TIFF
# reading a COG) works over this transport unmodified. Pulls in the pure-Rust
# `ureq` blocking client. Off by default so the core stays dependency-light.
http-range-reader = ["dep:ureq"]
# Optional Rayon-based parallel CPU work-stealing for tile compression /
# decompression (PTIFF-1.0-RUST-CORE-PLAN.md Phase 5 / §6). Pulls in the
# `rayon` data-parallelism crate. Off by default so the core stays
# dependency-light; multi-threaded results are guaranteed byte-identical to
# the sequential paths (deterministic decomposition clock).
parallel = ["dep:rayon"]

[dependencies]
# Intentionally minimal: the core is dependency-light by design (§4.2/§4.3).
# serde/serde_json are OPTIONAL and feature-gated so the default build stays
# dependency-free.
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# Optional TIFF codecs (pure-Rust): Deflate = RFC 1950 zlib wrapper via
# flate2's miniz_oxide backend (no system libz); JPEG baseline 4:4:4 encoding
# (jpeg-encoder) + decoding (jpeg-decoder). Feature-gated behind `tiff-codecs`.
flate2 = { version = "1", optional = true }
jpeg-encoder = { version = "0.7", optional = true }
jpeg-decoder = { version = "0.3", default-features = false, optional = true }
# Optional PDS4 XML label (de)serialization (blessed choice, PTIFF-1.0-RUST-CORE-PLAN.md
# §5 Dependency Evaluation). Feature-gated behind `pds4-backend`.
quick-xml = { version = "0.41", optional = true }
# Optional Zarr chunk compression (zstd), the blessed choice for Zarr chunk
# codecs (PTIFF-1.0-RUST-CORE-PLAN.md §5 Dependency Evaluation). Feature-gated
# behind `zarr-backend`. Zlib chunk compression reuses the already-optional
# `flate2` dependency declared above.
zstd = { version = "0.13", optional = true }
# Optional pure-Rust OpenEXR reader/writer (PTIFF-1.0-RUST-CORE-PLAN.md §5
# Dependency Evaluation). No unsafe code. Feature-gated behind `openexr-backend`.
exr = { version = "1.74", default-features = false, optional = true }
# Optional pure-Rust, blocking HTTP(S) client for the HTTP Range-request byte
# transport (`HttpRangeBinaryReader`), mirroring the C++ libcurl-based reader.
# rustls-based (default-native-free build). Feature-gated behind
# `http-range-reader`; same principle as the other optional backends.
ureq = { version = "3.4", default-features = false, features = ["rustls", "gzip"], optional = true }
# Optional Rayon data-parallelism pool for CPU-bound tile work (compression /
# decompression, Phase 5 §6). Feature-gated behind `parallel`; own build only.
rayon = { version = "1.10", optional = true }

# Mathematical geometry foundation (GEOMETRY-FOUNDATION.md): SO(3)/SE(3) Lie
# groups, quaternions, Twist/Wrench, linear algebra. `multicalc` is dependency-
# free (#![no_std], forbid(unsafe_code)), so it is an ALWAYS-ON core dependency
# and does not break the default dependency-free build gate.
multicalc = "0.10"

# version
semver = "1.0"

# Shortest-round-trip IEEE-754 digit generation for the MF-03B canonical
# JSON (RFC 8785 / JCS) encoder. RFC 8785 section 3.2.2.3 names Ryu as a
# compatible
# number-serialization reference; ryu produces the ECMAScript-compatible
# shortest digits (including ES tie-breaking, which std::fmt does not match
# on exact-midpoint doubles). Only the digits are taken from ryu: the
# ECMAScript Number::toString layout rules are applied by ptiff-core itself.
# Pure Rust, Apache-2.0 OR BSL-1.0; dependency-free.
ryu = "1"

[dev-dependencies]
# Enable the serde / backend features internally so their tests always run.
ptiff-core = { path = ".", features = ["serde", "memory-backend", "tiff-backend", "tiff-codecs", "isis-backend", "pds4-backend", "zarr-backend", "openexr-backend", "http-range-reader", "parallel"] }
serde_json = "1"

# Independent TIFF/BigTIFF reader used ONLY as a data-level interop oracle in
# tests: we write a file with our own backend and cross-read it with image-rs'
# `tiff` crate to verify format compatibility. Dev-dependency only, so it never
# enters the library build (the core itself stays dependency-free).
# `default-features = false` + explicit features stays minimal: Deflate/LZW
# decoding for those interop cases (PackBits is built in), and JPEG decoding
# via zune-jpeg to independently verify our JPEG strip output.
tiff = { version = "0.11", default-features = false, features = ["deflate", "lzw", "jpeg"] }

# Golden-file tests (§11.3): a SHA-256 digest locks byte-exact serialized output.
# Test-only; never enters the library build (the core stays dependency-free).
sha2 = "0.11.0"

# Property tests (§11.4): tile-arithmetic invariants (columns/rows/region/index
# consistency, overflow-freedom) via generated inputs. Test-only; never in the
# library build.
proptest = "1"
