# cbindgen configuration for the PTIFF 1.0 C ABI.
#
# THE RUST `extern "C"` SIGNATURES IN THIS CRATE ARE THE SOURCE OF TRUTH FOR
# THE ABI (plan §7.4 was updated 2026-08-24: the hand-maintained bindings/c/*.h
# is retired; cbindgen now *authorises* the header from the Rust declarations).
# `cargo build -p ptiff-c` regenerates `$OUT_DIR/ptiff_c.h`. Rust `///` doc
# comments carry the doc the header once had; cbindgen lifts them via
# `documentation = true`.

language = "C"
style = "both"

# Header preamble emitted verbatim above the generated declarations. The
# include guard, `#include` block and `extern "C"` linkage are added by
# cbindgen itself; this preamble carries only the parts the generator cannot
# author verbatim: the export macro and the opaque-handle forward declarations.
header = """
/*
 * ptiff_c.h
 *
 * PTIFF 1.0 C ABI over the Rust core (crates/ptiff-c).
 *
 * This header is GENERATED by cbindgen from the `extern "C"` declarations in
 * crates/ptiff-c/src/ (the source of truth for the ABI, plan §7.4). Do not
 * edit it by hand; regenerate with `cargo build -p ptiff-c`.
 *
 * Every function of the public surface is marked PTIFF_C_API so it lands in
 * the dynamic symbol table (importable by any FFI consumer).
 *
 * The include guard, `#include` block and `extern "C"` linkage are emitted by
 * cbindgen; only the export macro and opaque-handle forward declarations live
 * here.
 */

/* Opaque handles. Declared (never defined) here so the function pointers
 * below are valid C; consumers must not dereference these. */
typedef struct ptiff_image ptiff_image;
typedef struct ptiff_source ptiff_source;
typedef struct ptiff_sink ptiff_sink;

#if defined(_WIN32) && !defined(PTIFF_C_STATIC_DEFINE)
#ifdef ptiff_c_EXPORTS
#define PTIFF_C_API __declspec(dllexport)
#else
#define PTIFF_C_API __declspec(dllimport)
#endif
#elif defined(__GNUC__) || defined(__clang__)
#define PTIFF_C_API __attribute__((visibility("default")))
#else
#define PTIFF_C_API
#endif
"""


include_guard = "PTIFF_C_H"


autogen_warning = "/* THIS FILE IS AUTOMATICALLY GENERATED by cbindgen. Do not edit. */"
documentation = true
documentation_style = "doxy"

[export]
# The ABI surface: value structs/enums plus opaque handles. `#[no_mangle]
# extern "C"` functions are exported automatically; listing the types here
# names/orders them so they appear as first-class C types.
include = [
    "ptiff_camera",
    "ptiff_tile_info",
    "ptiff_image_descriptor",
    "ptiff_field",
    "ptiff_version",
    "ptiff_pixel_type",
    "ptiff_compression_kind",
    "ptiff_error_code",
    "ptiff_log_level",
    "ptiff_image",
    "ptiff_source",
    "ptiff_sink",
]
item_types = ["structs", "enums", "functions", "typedefs"]

# ---- Naming: the C header uses lowercase opaque handles. ----
[export.rename]
"PtiffImage" = "ptiff_image"
"PtiffSource" = "ptiff_source"
"PtiffSink" = "ptiff_sink"

[parse]
parse_deps = false
clean = false
include = ["ptiff-c"]
exclude = ["ptiff", "ptiff-core"]
