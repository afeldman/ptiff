[package]
name = "ptiff-bench-rust"
version = "0.1.0"
edition = "2021"
description = "Rust benchmarks over the ptiff binding (benchmarks/ suite)"
publish = false

[dependencies]
# The idiomatic Rust core crate (crates/ptiff-rust, package name `ptiff`).
ptiff = { path = "../../crates/ptiff-rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
