description = "Rust benchmarks over the ptiff binding (benchmarks/ suite)"
publish = false

[dependencies]
ptiff = { path = "../../bindings/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
pkg-config = "0.3"
