# pre-commit configuration for the ptiff (Planetary TIFF) project.
# Install hooks with:  pre-commit install
# Run on all files:    pre-commit run --all-files
# Update hook revs:    pre-commit autoupdate

repos:
  # ---------------------------------------------------------------------------
  # Generic / housekeeping hooks (root of all evil is a messy tree)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Only syntax-check, don't try to parse custom tags in CI configs.
        args: [--unsafe]
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-symlinks
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: forbid-submodules

  # ---------------------------------------------------------------------------
  # EditorConfig conformance (mirrors .editorconfig)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.2.0
    hooks:
      - id: editorconfig-checker
        exclude_types: [markdown]
        # Excluded because a dedicated, authoritative formatter/linter owns
        # their layout (mirroring `.clang-format` for C/C++ below):
        #   - Shell scripts    (shfmt, `-i 4`, in this repo)
        #   - CMakeLists.txt   (cmake-format, via `.cmake-format.yaml`,
        #                       uses non-4space continuation alignment)
        #   - Cargo.lock       (generated by cargo, own 1-space list layout)
        #
        # `ptiff-cli/build.rs` and the benchmark scripts contain multi-line
        # string/hash/docstring alignment that intentionally is not a multiple
        # of the file's declared indent size.
        #
        # LICENSE / LICENSE-SPEC are legal texts and are never reformatted.
        # Doxyfile uses its own 4-space-plus key/value continuation layout.
        exclude: '^(LICENSE|LICENSE-SPEC|Doxyfile)$|^(scripts/interop\.sh|benchmarks/run_benchmarks\.sh)$|^benchmarks/rust_bench/Cargo\.lock$|^benchmarks/src/(bench_python\.py|bench_ruby\.rb)$|^ptiff-cli/build\.rs$|\.(c|cc|cpp|cxx|h|hh|hpp|hxx|i)$'

  # ---------------------------------------------------------------------------
  # C / C++ (core library + bindings)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.7
    hooks:
      - id: clang-format
        # Uses .clang-format from the repo root (affects the staged files).
        types_or: [c, c++]

  # ---------------------------------------------------------------------------
  # CMake (build system). Uses the `cmakelang` pip package directly so it does
  # not depend on a third-party pre-commit wrapper repo.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: cmake-format
        name: cmake-format
        description: Runs cmake-format to style CMakeLists.txt / *.cmake files.
        entry: cmake-format
        language: python
        additional_dependencies: [cmakelang==0.6.13]
        args: [--config-files, .cmake-format.yaml]
        types: [cmake]
      - id: cmake-lint
        name: cmake-lint
        description: Lints CMakeLists.txt / *.cmake files.
        entry: cmake-lint
        language: python
        additional_dependencies: [cmakelang==0.6.13]
        args: [--config-files, .cmake-format.yaml]
        types: [cmake]

  # ---------------------------------------------------------------------------
  # Python (bindings/python + bindings/mcp), excludes SWIG-generated files
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ---------------------------------------------------------------------------
  # Go bindings
  # ---------------------------------------------------------------------------
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-imports
        args: [-local, github.com/crater/ptiff-go]
        exclude: ^bindings/go/ptiff/ptiff\.go$ # SWIG-generated, never hand-edited

  # ---------------------------------------------------------------------------
  # Rust bindings. cargo fmt runs against the workspace manifests directly, so
  # it works even though the C++ library is not built. clippy is intentionally
  # left to CI because it needs the built PTIFF library.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        description: Runs `cargo fmt --all -- --check` for Rust sources.
        entry: bash -c 'for m in ptiff-cli bindings/rust benchmarks/rust_bench; do if [ -f "$m/Cargo.toml" ]; then (cd "$m" && cargo fmt --all -- --check) || exit 1; fi; done'
        language: system
        types: [rust]

  # ---------------------------------------------------------------------------
  # Shell scripts (scripts/, benchmarks/)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  # shfmt is a Go binary (mvdan.cc/sh). Bundled via language: golang so we do
  # not depend on the mvdan/sh repo shipping a pre-commit manifest.
  - repo: local
    hooks:
      - id: shfmt
        name: shfmt
        description: Runs shfmt (shell formatter) matching the editorconfig 4-space rules.
        entry: shfmt
        language: golang
        additional_dependencies: [mvdan.cc/sh/v3/cmd/shfmt@v3.9.0]
        args: [-i, '4', -ci, -s]
        types: [shell]


  # ---------------------------------------------------------------------------
  # C / C++ (core library + bindings)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.7
    hooks:
      - id: clang-format
        # Uses .clang-format from the repo root (affects the staged files).
        types_or: [c, c++]

  # ---------------------------------------------------------------------------
