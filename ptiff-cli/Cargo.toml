[package]
name = "ptiff-cli"
version = "0.4.0"
edition = "2021"
description = "Command-line interface for the PTIFF planetary image standard (libptiff_c)"
license = "Apache-2.0"
default-run = "ptiff"

[[bin]]
name = "ptiff"
path = "src/main.rs"

[dependencies]
# The idiomatic Rust binding, reused rather than re-implementing FFI.
ptiff = { path = "../bindings/rust" }
clap = { version = "4.6.6", features = ["derive"] }
serde_json = "1"

[build-dependencies]
# Resolve the rpath for libptiff_c (and libptiff) against the installed prefix.
pkg-config = "0.3.34"
